changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - github-actions[bot]
  categories:
    - title: "🚀 Features"
      labels:
        - enhancement
      commits:
        - "feat:*"
        - "feat(*):*"
    - title: "🐛 Bug Fixes"
      labels:
        - bug
      commits:
        - "fix:*"
        - "fix(*):*"
    - title: "🧹 Refactoring & Maintenance"
      commits:
        - "refactor:*"
        - "perf:*"
        - "chore:*"
    - title: "📝 Documentation"
      commits:
        - "docs:*"
